<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f7" />
  <meta name="description" content="迷いを増やすのではなく、決断を助けるタロット思考ツール。" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231e2430'/%3E%3Cpath d='M18 20h28v24H18z' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M25 32h14M34 26l6 6-6 6' fill='none' stroke='%2387a5ff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <title>DECIDE — タロット思考ツール</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="home" aria-label="ホームへ">DECIDE<span class="brand-dot">.</span></button>
      <div class="header-actions">
        <button class="icon-button icon-only" id="share-button" aria-label="アプリを共有"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 11v8h14v-8"/></svg></button>
        <button class="icon-button icon-only gear-button" id="settings-button" aria-label="設定を開く">⚙</button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button class="nav-item active" data-nav="home"><span>DECIDE</span></button>
      <button class="nav-item" data-nav="history"><span>DECISION LOG</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
